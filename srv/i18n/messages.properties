# ════════════════════════════════════════════════════════════════════
#  GatePass — texts
#
#  Section 8: "The message column is what the user must actually see —
#  put those texts in i18n, never hard-coded in the middle of your
#  logic."  Every string below is referenced by its key from
#  srv/gatepass-service.js or from an annotation; nothing in the code
#  spells out an English sentence.
# ════════════════════════════════════════════════════════════════════

# ── BR-01: visitDate not in the past ──
BR01_PAST_DATE=A pass cannot be raised for a date that has already passed.

# ── BR-02: the visit window ──
BR02_WINDOW_ORDER=The visit window must end after it starts.
BR02_MAX_12H=A pass cannot cover more than 12 hours.
BR02_GATE_HOURS=Plant {0} admits visitors between {1} and {2}.

# ── BR-03: field level and active checks ──
BR03_NAME_SHORT=Visitor name must be at least 3 characters.
BR03_MOBILE=Enter a valid 10-digit mobile number.
BR03_HOST_INACTIVE={0} is no longer active and cannot host a visitor.
BR03_PLANT_INACTIVE=Plant {0} is no longer active.
BR03_AREA_INACTIVE=Area {0} is no longer active.
BR03_PURPOSE_DETAIL=When the purpose is Other, describe it in at least 15 characters.

# ── BR-05: safety induction ──
BR05_INDUCTION_REQUIRED=Area {0} requires a valid safety induction.
BR05_INDUCTION_DATE_REQUIRED=Area {0} requires the date the safety induction expires.
BR05_INDUCTION_EXPIRED=The induction expired on {0}; the visitor cannot enter {1}.

# ── BR-06: the check-in window ──
BR06_WRONG_DATE=This pass is valid on {0}, not today.
BR06_OUTSIDE_WINDOW=This pass is valid from {0} to {1} on {2}. Ask the host to extend it.

# ── BR-07: the same visitor on two open passes ──
BR07_OPEN_PASS_WARNING=Warning: this visitor already has an open pass today at {0}.
BR07_ON_SITE_ERROR=Already on site at {0} on pass {1} — check them out there first.

# ── BR-08: the badge ──
BR08_BADGE_REQUIRED=Enter the badge number issued.
BR08_BADGE_IN_USE=Badge {0} is already issued to {1} on pass {2}.

# ── BR-09: items carried back out ──
BR09_ITEMS_UNCONFIRMED={0} returnable item(s) not confirmed: {1}. Confirm them, or record why they are not leaving.
BR09_REMARK_REQUIRED=Record why this item is not leaving with the visitor.
BR09_ONLY_ON_SITE=Items can only be confirmed while the visitor is on site.
BR09_ITEM_NOT_ON_PASS=Item {0} is not declared on this pass.

# ── BR-10: the rejection reason ──
BR10_REASON_SHORT=Give a reason of at least 10 characters. The host has to be able to act on it.

# ── BR-11: segregation of duties ──
BR11_SELF_APPROVE=You cannot approve a visitor you are hosting yourself.

# ── BR-13: copy ──
BR13_COPIED=Pass copied from {0}. Check the dates and the induction validity before submitting.

# ── Mandatory fields (Section 6.1) ──
MANDATORY_COMPANY=Enter the company the visitor represents.
MANDATORY_VISITDATE=Enter the date of the visit.
MANDATORY_VALIDFROM=Enter the time the visit window opens.
MANDATORY_VALIDTO=Enter the time the visit window closes.
MANDATORY_PURPOSE=Select the purpose of the visit.
MANDATORY_IDTYPE=Select the type of ID proof presented.
MANDATORY_IDNUMBER=Enter the ID proof number.
MANDATORY_AREA=Select the area being visited.
MANDATORY_PLANT=Select the plant.
AREA_UNKNOWN=The selected area does not exist.
AREA_WRONG_PLANT=The selected area must belong to the chosen plant.

# ── Lifecycle and access ──
PASS_NOT_FOUND=Pass not found.
PASS_READONLY=A pass can only be changed while it is a draft. This one is {0}.
INVALID_STATUS=A pass in status {1} cannot be {0}.
INVALID_ACTION=Unknown action {0}.
NOT_EMPLOYEE=You must be a registered employee to create a visitor pass.
EVENTS_IMMUTABLE=The audit trail cannot be created, changed or deleted by anybody.
MASTER_NO_DELETE=Master data is deactivated, never deleted. Clear the Active flag instead.
SYS_FIELDS_IGNORED=These fields are set by the system and were ignored: {0}.
ITEM_NOT_FOUND=Item not found.
DAYEND_DONE=Day-end job complete: {0} pass(es) expired, {1} overstay(s) flagged.

# ── Action confirmations & success notifications ──
PASS_SUBMITTED=Pass {0} submitted successfully.
PASS_APPROVED=Pass {0} approved successfully.
PASS_REJECTED=Pass {0} rejected successfully.
PASS_CANCELLED=Pass {0} cancelled successfully.
CHECKIN_SUCCESS=Visitor {0} checked in successfully. Badge: {1}.
CHECKOUT_SUCCESS=Visitor {0} checked out successfully.
ITEM_RETURN_CONFIRMED=Item return confirmed.
