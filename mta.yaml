_schema-version: 3.3.0
ID: gatepass
version: 1.0.0
description: "Visitor Gate Pass &amp; On-Site Register — NubTech Industries"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production
modules:
  - name: gatepass-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm install --production
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: gatepass-auth
      - name: gatepass-db
      - name: gatepass-destination

  - name: gatepass-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: gatepass-db

  - name: gatepass-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: gatepassgateconsole
          artifacts:
            - gate-console.zip
          target-path: app/
        - name: gatepassmypasses
          artifacts:
            - my-passes.zip
          target-path: app/
        - name: gatepassreports
          artifacts:
            - reports.zip
          target-path: app/
        - name: gatepassapprovals
          artifacts:
            - approvals.zip
          target-path: app/
        - name: gatepassfootfall
          artifacts:
            - footfall.zip
          target-path: app/
        - name: gatepassadminplants
          artifacts:
            - admin-plants.zip
          target-path: app/
        - name: gatepassadminemployees
          artifacts:
            - admin-employees.zip
          target-path: app/
        - name: gatepassadminareas
          artifacts:
            - admin-areas.zip
          target-path: app/
    requires:
      - name: gatepass-auth
      - name: srv-api
      - name: gatepass-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  - name: gatepass-destination-content
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: gatepass-destination
        parameters:
          content-target: true
      - name: gatepass-html5-repo-host
        parameters:
          service-key:
            name: gatepass-html5-repo-host-key
      - name: gatepass-auth
        parameters:
          service-key:
            name: gatepass-auth-key
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: gatepass_html5_repo_host
              ServiceInstanceName: gatepass-html5-repo-host
              ServiceKeyName: gatepass-html5-repo-host-key
              sap.cloud.service: gatepass
            - Name: gatepass_auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: gatepass-auth
              ServiceKeyName: gatepass-auth-key
              sap.cloud.service: gatepass

  - name: gatepassgateconsole
    type: html5
    path: app/gate-console
    build-parameters:
      builder: custom
      commands:
        - "node -e \"require('child_process').execSync('npx -y bestzip ../gate-console.zip *', {cwd: 'webapp'})\""
      build-result: .
      supported-platforms:
        []
  - name: gatepassmypasses
    type: html5
    path: app/my-passes
    build-parameters:
      builder: custom
      commands:
        - "node -e \"require('child_process').execSync('npx -y bestzip ../my-passes.zip *', {cwd: 'webapp'})\""
      build-result: .
      supported-platforms:
        []
  - name: gatepassreports
    type: html5
    path: app/reports
    build-parameters:
      builder: custom
      commands:
        - "node -e \"require('child_process').execSync('npx -y bestzip ../reports.zip *', {cwd: 'webapp'})\""
      build-result: .
      supported-platforms:
        []
  - name: gatepassapprovals
    type: html5
    path: app/approvals
    build-parameters:
      builder: custom
      commands:
        - "node -e \"require('child_process').execSync('npx -y bestzip ../approvals.zip *', {cwd: 'webapp'})\""
      build-result: .
      supported-platforms:
        []
  - name: gatepassfootfall
    type: html5
    path: app/footfall
    build-parameters:
      builder: custom
      commands:
        - "node -e \"require('child_process').execSync('npx -y bestzip ../footfall.zip *', {cwd: 'webapp'})\""
      build-result: .
      supported-platforms:
        []
  - name: gatepassadminplants
    type: html5
    path: app/admin-plants
    build-parameters:
      builder: custom
      commands:
        - "node -e \"require('child_process').execSync('npx -y bestzip ../admin-plants.zip *', {cwd: 'webapp'})\""
      build-result: .
      supported-platforms:
        []
  - name: gatepassadminemployees
    type: html5
    path: app/admin-employees
    build-parameters:
      builder: custom
      commands:
        - "node -e \"require('child_process').execSync('npx -y bestzip ../admin-employees.zip *', {cwd: 'webapp'})\""
      build-result: .
      supported-platforms:
        []
  - name: gatepassadminareas
    type: html5
    path: app/admin-areas
    build-parameters:
      builder: custom
      commands:
        - "node -e \"require('child_process').execSync('npx -y bestzip ../admin-areas.zip *', {cwd: 'webapp'})\""
      build-result: .
      supported-platforms:
        []
  - name: gatepass-ui
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: gatepass-auth
      - name: gatepass-destination
      - name: gatepass-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: gatepass-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: gatepass-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Admin (gatepass ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Admin'
          - name: 'Host (gatepass ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Host'
          - name: 'SecurityGuard (gatepass ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.SecurityGuard'
          - name: 'SecuritySupervisor (gatepass ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.SecuritySupervisor'
    requires:
      - name: app-api
  - name: gatepass-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: gatepass-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                Description: Gatepass CAP Backend Service
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
    requires:
      - name: srv-api

  - name: gatepass-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: gatepass-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
